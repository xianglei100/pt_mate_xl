name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag to create (e.g., v2.27.0); it must not already exist'
        required: true
        type: string
      source_ref:
        description: 'Candidate source ref/commit to build (branch, tag, or SHA; do not reuse an already released tag)'
        required: true
        type: string
      android_build_number:
        description: 'Explicit Android versionCode for this candidate; must be an integer greater than 183'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Use \n for new lines, leave empty to use commit message)'
        required: false
        type: string
        default: ''
      secure_storage_transactions:
        description: 'Enable phase-2 secure-storage transactions'
        required: false
        type: boolean
        default: false
permissions:
  contents: write

# A manual candidate and a tag push for the same release tag must never build
# concurrently. Manual runs also reject an existing tag before publishing.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  secure-storage-safety:
    uses: ./.github/workflows/secure-storage-safety.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

  build-android:
    needs: secure-storage-safety
    runs-on: ubuntu-latest
    outputs:
      android_build_number: ${{ steps.version.outputs.android_build_number }}
      release_phase: ${{ steps.version.outputs.release_phase }}
      secure_storage_transactions: ${{ steps.version.outputs.secure_storage_transactions }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
        fetch-depth: 1
        
    - name: Resolve release candidate and version
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ANDROID_BUILD_NUMBER: ${{ inputs.android_build_number }}
        INPUT_SECURE_STORAGE_TRANSACTIONS: ${{ inputs.secure_storage_transactions }}
      run: |
        set -euo pipefail
        SOURCE_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)
        if [ -z "$SOURCE_VERSION" ]; then
          echo "pubspec.yaml does not contain a version."
          exit 1
        fi
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="$INPUT_TAG"
          BUILD_NUMBER="$INPUT_ANDROID_BUILD_NUMBER"
          TRANSACTIONS="$INPUT_SECURE_STORAGE_TRANSACTIONS"
          if [ -z "$TAG" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Manual release requires both tag and android_build_number."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Manual release tag $TAG already exists. Create a new candidate tag; never rerun a tag that may already have published Phase 1."
            exit 1
          fi
        else
          TAG=${GITHUB_REF#refs/tags/}
          BUILD_NUMBER=${SOURCE_VERSION##*+}
          # Tags are deliberately always Phase 1. Phase 2 must be a manually
          # dispatched, separately identified candidate release.
          TRANSACTIONS=false
        fi
        if [[ ! "$TAG" =~ ^v.+$ ]]; then
          echo "Release tag must start with v."
          exit 1
        fi
        if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -le 183 ]; then
          echo "Android build number must be an integer greater than the installed +183 baseline."
          exit 1
        fi
        if [ "$TRANSACTIONS" = "true" ]; then
          RELEASE_PHASE=phase2
        elif [ "$TRANSACTIONS" = "false" ]; then
          RELEASE_PHASE=phase1
        else
          echo "secure_storage_transactions must be true or false."
          exit 1
        fi
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "android_build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "secure_storage_transactions=$TRANSACTIONS" >> $GITHUB_OUTPUT
        echo "release_phase=$RELEASE_PHASE" >> $GITHUB_OUTPUT
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        
        # Check if tag contains beta
        if [[ "$TAG" == *"beta"* ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK API 37
      uses: android-actions/setup-android@v4

    - name: Install Android SDK API 37
      run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

    - name: Read Flutter version
      id: flutter-version
      shell: bash
      run: |
        version="$(tr -d '[:space:]' < .flutter-version)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        
    # Flutter SDK 缓存
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.flutter-version.outputs.version }}
        channel: 'stable'
        cache: true  # 启用 Flutter SDK 缓存
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
        cache-path: '${{ runner.tool_cache }}/flutter'

    - name: Cache Pub dependencies
      uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-cache-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-cache-
    
    # Gradle 缓存
    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.lock', '**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
        
    - name: Get dependencies
      uses: ./.github/actions/pub-get
      
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      
    - name: Create key.properties
      run: |
        echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "storeFile=keystore.jks" >> android/key.properties
      
    - name: Build APK - ARM64 (v8a)
      run: |
        flutter build apk --release --target-platform android-arm64 \
          --dart-define=ENABLE_SECURE_STORAGE_TRANSACTIONS=${{ steps.version.outputs.secure_storage_transactions }}
        {
          echo "## Secure-storage release gate"
          echo "- Phase: \`${{ steps.version.outputs.release_phase }}\`"
          echo "- ENABLE_SECURE_STORAGE_TRANSACTIONS: \`${{ steps.version.outputs.secure_storage_transactions }}\`"
          echo "- Android versionCode: \`${{ steps.version.outputs.android_build_number }}\`"
          echo "- Source commit: \`${{ steps.version.outputs.source_sha }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pt_mate-${{ steps.version.outputs.version }}-arm64-v8a.apk

    - name: Verify release APK identity and backup policy
      run: |
        APK="build/app/outputs/flutter-apk/pt_mate-${{ steps.version.outputs.version }}-arm64-v8a.apk"
        APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -1)
        if [ -z "$APKANALYZER" ]; then
          echo "apkanalyzer was not found in the Android SDK."
          exit 1
        fi
        APPLICATION_ID=$($APKANALYZER manifest application-id "$APK")
        VERSION_CODE=$($APKANALYZER manifest version-code "$APK")
        $APKANALYZER manifest print "$APK" > /tmp/ptmate-release-manifest.xml
        test "$APPLICATION_ID" = "com.github.justlookatnow.ptmate"
        test "$VERSION_CODE" -eq "${{ steps.version.outputs.android_build_number }}"
        if grep -q 'securestoragetest' /tmp/ptmate-release-manifest.xml; then
          echo "Secure-storage test profile leaked into the production APK."
          exit 1
        fi
        if ! grep -q 'android:allowBackup="false"' /tmp/ptmate-release-manifest.xml; then
          echo "Production APK does not disable Android backup."
          exit 1
        fi
        if grep -q 'ALLOW_BACKUP' /tmp/ptmate-release-manifest.xml; then
          echo "Production APK still exposes ALLOW_BACKUP."
          exit 1
        fi
          
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v6
      with:
        name: android-artifacts
        path: |
          build/app/outputs/flutter-apk/pt_mate-${{ steps.version.outputs.version }}-arm64-v8a.apk
        retention-days: 1

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
        
    - name: Extract version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        
        # Check if tag contains beta
        if [[ "$TAG" == *"beta"* ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Get release message
      id: commit_message
      env:
        # Use environment variable to safely pass the input
        INPUT_NOTES: ${{ github.event.inputs.release_notes }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_NOTES" ]; then
          # Support manual \n for new lines in UI input
          # Use sed for replacement
          echo -e "$INPUT_NOTES" | sed 's/\\n/\n/g' > /tmp/release_msg.txt
        else
          # Get the latest commit message (full message including body)
          git log -1 --pretty=format:"%B" > /tmp/release_msg.txt
        fi
        
        # Save to output using multiline format
        echo "message<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/release_msg.txt >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      
    - name: Create Release and Upload All Artifacts
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.event_name == 'workflow_dispatch' && needs.build-android.outputs.source_sha || '' }}
        name: Release ${{ steps.version.outputs.tag }}
        body: |
          ## Changes in this release
          ${{ steps.commit_message.outputs.message }}

          ## Secure-storage rollout

          - Phase: `${{ needs.build-android.outputs.release_phase }}`
          - `ENABLE_SECURE_STORAGE_TRANSACTIONS`: `${{ needs.build-android.outputs.secure_storage_transactions }}`
          - Android versionCode: `${{ needs.build-android.outputs.android_build_number }}`
          - Source commit: `${{ needs.build-android.outputs.source_sha }}`
          
          ## 📱 Android APK Downloads
          
          - **ARM64 APK** (arm64-v8a): For modern 64-bit devices
          
        draft: false
        prerelease: ${{ steps.version.outputs.is_prerelease }}
        files: |
          android-artifacts/pt_mate-${{ steps.version.outputs.version }}-arm64-v8a.apk
        fail_on_unmatched_files: true

    - name: Notify Update Server (POST /api/v1/github/version-update)
      env:
        UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
        GITHUB_WEBHOOK_SECRET: ${{ secrets.UPDATE_WEBHOOK_SECRET }}
        VERSION_TAG: ${{ steps.version.outputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
        RELEASE_NOTES: ${{ steps.commit_message.outputs.message }}
      run: |
        set -euo pipefail

        if [ -z "${UPDATE_SERVER_URL:-}" ]; then
          echo "UPDATE_SERVER_URL is not set. Skipping update server notification."
          exit 0
        fi

        DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/${VERSION_TAG}"
        ANDROID_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/pt_mate-${VERSION}-arm64-v8a.apk"
        
        # Build JSON payload safely
        JSON_PAYLOAD=$(jq -n \
          --arg version "$VERSION" \
          --arg release_notes "$RELEASE_NOTES" \
          --arg download_url "$DOWNLOAD_URL" \
          --arg android_download_url "$ANDROID_DOWNLOAD_URL" \
          '{
            version: $version,
            release_notes: $release_notes,
            download_url: $download_url,
            android_download_url: $android_download_url
          }')

        echo "Sending version update to $UPDATE_SERVER_URL/api/v1/github/version-update"
        echo "$JSON_PAYLOAD" | curl -sS -X POST "$UPDATE_SERVER_URL/api/v1/github/version-update" \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: ${GITHUB_WEBHOOK_SECRET}" \
          -d @- | tee /tmp/update_server_response.json

        HTTP_OK=$(jq -r '.message? // empty' /tmp/update_server_response.json || true)
        if [ -z "$HTTP_OK" ]; then
          echo "😒 Update server did not return success message. Response:" >&2
          cat /tmp/update_server_response.json >&2
          exit 1
        else
          echo "✅ Update server acknowledged: $HTTP_OK"
        fi
